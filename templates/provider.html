<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{provider_name}} VPS Deals & Pricing — {{brand}}</title>
    <meta name="description" content="Current VPS deals and pricing from {{provider_name}}. Real prices, updated automatically.">
    <link rel="canonical" href="https://{{domain}}/provider-{{provider_name}}.html">
    
    <meta property="og:title" content="{{provider_name}} VPS Deals | {{brand}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://{{domain}}/">
    <meta name="twitter:card" content="summary">
    
    <script type="application/ld+json">{{product_jsonld}}</script>
    <script type="application/ld+json">{{breadcrumb_jsonld}}</script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e4e4e7; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
        header { border-bottom: 1px solid #2a2d35; padding-bottom: 1rem; margin-bottom: 2rem; }
        header h1 { font-size: 1.4rem; color: #f4f4f5; }
        .breadcrumb { font-size: 0.8rem; color: #71717a; margin-bottom: 0.5rem; }
        .breadcrumb a { color: #818cf8; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th { text-align: left; padding: 0.75rem; background: #1a1b23; border-bottom: 1px solid #2a2d35; color: #a1a1aa; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 0.75rem; border-bottom: 1px solid #2a2d35; }
        td a { color: #818cf8; text-decoration: none; }
        td a:hover { text-decoration: underline; }
        .price { font-weight: 700; color: #818cf8; }
        .nav a { color: #818cf8; text-decoration: none; font-size: 0.85rem; margin-right: 1rem; }
        footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #2a2d35; color: #71717a; font-size: 0.8rem; }
        .generated { color: #52525b; font-size: 0.75rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="breadcrumb"><a href="index.html">Home</a> / {{provider_name}}</div>
        <h1>{{provider_name}} VPS Deals & Pricing</h1>
        <div class="nav">
            <a href="index.html">All Deals</a>
            <a href="compare.html">Compare</a>
        </div>
    </header>
    
    <table>
        <thead><tr><th>Plan</th><th>Price</th><th>Currency</th></tr></thead>
        <tbody>{{DEAL_ROWS}}</tbody>
    </table>
    
    <div class="generated">Last updated: {{generated}}</div>
    
    <footer>
        <p>{{brand}} — Prices sourced from {{provider_name}}'s official pricing page. No fabricated data.</p>
    </footer>
</div>
</body>
</html>
